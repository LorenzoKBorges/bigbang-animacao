<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Olho</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #07020c;
        overflow: hidden;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: crosshair;
      }
    </style>
  </head>
  <body>
    <canvas id="olho" role="img" aria-label="Um olho com falhas em volta que segue o ponteiro"></canvas>
    <script src="olho.js"></script>
  </body>
</html>
